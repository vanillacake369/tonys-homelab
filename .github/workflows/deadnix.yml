name: Deadnix
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["**.nix", "flake.lock", ".github/**"]
  merge_group:
jobs:
  deadnix:
    name: Nix Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
        with:
          git-crypt-key: ${{ secrets.GIT_CRYPT_KEY }}
      - run: nix develop -c just check nix
