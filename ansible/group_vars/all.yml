# 2026.04 K8s Cluster Configuration (General Settings)
# ------------------------------------------------------------
# NOTE: pod_cidr, service_cidr, api_vip, k8s_version, and cilium_helm_version
# are injected via dynamic inventory (network/topology.nix).

kube_vip_version: "1.1.0"

# Networking (Cilium eBPF Optimization)
cilium_mtu: 1440
cilium_kube_proxy_replacement: "true"

# Helm / CNI Settings
# NOTE: cilium_helm_version is injected from network/topology.nix via dynamic inventory.
cilium_namespace: "kube-system"

# Ansible Controls
# NOTE: ansible_ssh_common_args is injected per-host from dynamic inventory
# with ProxyJump (via host deployment target).
