# roles/kube-node/tasks/bootstrap.yml (Josh Rosso Method - Pure Install Logic)
# --------------------------------------------------------------------------------

# [1] Pre-flight: Runtime Readiness
- name: Ensure containerd is running
  systemd:
    name: containerd
    state: started
    enabled: yes

- name: Wait for CRI connectivity
  shell: crictl version
  register: cri_res
  until: cri_res is succeeded
  retries: 10
  delay: 3

- name: Pre-pull Kubernetes images
  shell: kubeadm config images pull --cri-socket unix:///run/containerd/containerd.sock

# [2] Leader Initialization (Only on the FIRST master)
- name: Leader Setup Block
  block:
    - name: Generate kubeadm init config
      template:
        src: kubeadm-config.yaml.j2
        dest: /etc/kubernetes/kubeadm-config.yaml

    - name: Run kubeadm init
      shell: |
        kubeadm init \
          --config /etc/kubernetes/kubeadm-config.yaml \
          --upload-certs \
          --ignore-preflight-errors=all \
          --v=5

    - name: Generate join credentials
      shell: |
        JOIN_CMD=$(kubeadm token create --print-join-command)
        CERT_KEY=$(kubeadm init phase upload-certs --upload-certs | tail -n 1)
        echo "$JOIN_CMD|$CERT_KEY"
      register: join_facts_raw

    - name: Propagate facts globally
      set_fact:
        global_worker_join_cmd: "{{ join_facts_raw.stdout.split('|')[0] }}"
        global_cert_key: "{{ join_facts_raw.stdout.split('|')[1] }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      with_items: "{{ groups['all'] }}"
  when: 
    - node_role == 'master'
    - inventory_hostname == groups['k8s_masters'][0]

# [3] Secondary Masters & Workers Join
- name: Node Join Block
  block:
    - name: Prepare Kubelet for Join
      shell: |
        systemctl stop kubelet || true
        rm -f /var/lib/kubelet/kubeadm-flags.env

    - name: Join Secondary Control Plane
      shell: |
        kubeadm reset -f || true
        {{ global_worker_join_cmd }} \
        --control-plane \
        --certificate-key {{ global_cert_key }} \
        --ignore-preflight-errors=all \
        --v=5
      register: master_join_res
      until: master_join_res is succeeded
      retries: 5
      delay: 20
      throttle: 1
      when: node_role == 'master'

    - name: Join Worker Node
      shell: |
        {{ global_worker_join_cmd }} \
        --ignore-preflight-errors=all
      when: node_role == 'worker'
  when: inventory_hostname != groups['k8s_masters'][0]
