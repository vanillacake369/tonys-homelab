# roles/kube-node/tasks/init-leader.yml
# ------------------------------------------------------------
# 첫 번째 마스터 노드에서만 실행: VIP 수동 바인딩 → kubeadm init → kube-vip 배치
# NOTE: kube-vip은 super-admin.conf(hostPath)가 필요하므로 kubeadm init 후에만 배포 가능.
#       kubeadm init은 admin.conf가 VIP를 가리키므로 VIP가 로컬에 바인딩되어 있어야 한다.
#       → ip addr add로 임시 VIP 바인딩 후 init, kube-vip 배포 후 수동 VIP 제거.

- name: "[Leader] Initialize Control Plane"
  block:
    - name: Ensure /etc/kubernetes exists
      file:
        path: /etc/kubernetes
        state: directory
        mode: "0755"

    - name: Generate kubeadm init config
      template:
        src: kubeadm-config.yaml.j2
        dest: /etc/kubernetes/kubeadm-config.yaml
        mode: "0600"

    - name: Ensure manifests directory exists
      file:
        path: /etc/kubernetes/manifests
        state: directory
        mode: "0755"

    - name: Bind VIP to interface temporarily (kube-vip not yet available)
      shell: ip addr add {{ api_vip }}/32 dev {{ kube_vip_interface }} || true
      when: kube_vip_interface is defined

    - name: Run kubeadm init
      shell: >-
        kubeadm init
        --config /etc/kubernetes/kubeadm-config.yaml
        --upload-certs
        --skip-phases=addon/kube-proxy
        --ignore-preflight-errors=SystemVerification
        --v=5
      register: kubeadm_init_result

    - name: Create kube-vip kubeconfig (localhost, not VIP)
      shell: |
        cp /etc/kubernetes/super-admin.conf /etc/kubernetes/kube-vip.conf
        sed -i 's|https://{{ api_vip }}:6443|https://127.0.0.1:6443|' /etc/kubernetes/kube-vip.conf
        chmod 600 /etc/kubernetes/kube-vip.conf

    - name: Deploy kube-vip static pod manifest
      template:
        src: kube-vip.yaml.j2
        dest: /etc/kubernetes/manifests/kube-vip.yaml
        mode: "0644"
      when: kube_vip_interface is defined

    - name: Wait for kube-vip to take over VIP
      uri:
        url: "https://{{ api_vip }}:6443/healthz"
        validate_certs: no
      register: api_ready
      until: api_ready.status == 200
      retries: 30
      delay: 5

    - name: Remove temporary VIP binding (kube-vip manages it now)
      shell: ip addr del {{ api_vip }}/32 dev {{ kube_vip_interface }}
      when: kube_vip_interface is defined
      failed_when: false

    - name: Verify VIP is still reachable via kube-vip
      uri:
        url: "https://{{ api_vip }}:6443/healthz"
        validate_certs: no
      register: api_verify
      until: api_verify.status == 200
      retries: 10
      delay: 3

    - name: Extract join credentials via API (not stdout parsing)
      shell: |
        set -euo pipefail
        export KUBECONFIG=/etc/kubernetes/admin.conf
        JOIN_CMD=$(kubeadm token create --print-join-command)
        CERT_KEY=$(kubeadm init phase upload-certs --upload-certs 2>/dev/null | tail -1)
        echo "${JOIN_CMD}|${CERT_KEY}"
      register: join_facts_raw

    - name: Propagate join credentials globally
      set_fact:
        global_worker_join_cmd: "{{ join_facts_raw.stdout.split('|')[0] }}"
        global_cert_key: "{{ join_facts_raw.stdout.split('|')[1] }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      with_items: "{{ groups['all'] }}"

  when:
    - node_role == 'master'
    - inventory_hostname == groups['k8s_masters'][0]
