---
# 공유 Gateway 로 들어온 트래픽을 BookOrbit 앱 서비스(:3000)로 라우팅한다.
#   parentRef 는 gateway 네임스페이스의 Gateway 를 가리킨다(Gateway 의 allowedRoutes=All 로 허용됨).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit
  namespace: bookorbit
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
  rules:
    - backendRefs:
        - name: bookorbit
          port: 3000
