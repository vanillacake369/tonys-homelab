---
# 앱이 접속하는 Postgres Service.
# 일반 ClusterIP(VIP)를 쓴다 — 단일 replica 에 headless 를 쓰면 plain hostname
#   (bookorbit-postgres) 의 DNS 해석이 실패하기 때문이다.
apiVersion: v1
kind: Service
metadata:
  name: bookorbit-postgres
  namespace: bookorbit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
