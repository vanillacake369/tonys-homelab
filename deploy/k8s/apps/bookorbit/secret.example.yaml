---
# 형태 참고용 템플릿 — 실제 값을 채워 커밋하지 않고, kustomization 에서도 참조하지 않는다.
# 실제 시크릿은 SOPS 로 암호화된 secret.enc.yaml 로만 존재해야 하며,
#   그 파일은 SOPS 게이트를 통과한 뒤에 생성·커밋한다
#   (절차: docs/phase0-sops-runbook.md).
# 값 생성:
#   - JWT_SECRET            : openssl rand -hex 32
#   - POSTGRES_PASSWORD     : openssl rand -hex 24
#   - SETUP_BOOTSTRAP_TOKEN : openssl rand -hex 16
apiVersion: v1
kind: Secret
metadata:
  name: bookorbit-secret
  namespace: bookorbit
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME__openssl_rand_hex_24"
  JWT_SECRET: "CHANGE_ME__openssl_rand_hex_32"
  SETUP_BOOTSTRAP_TOKEN: "CHANGE_ME__openssl_rand_hex_16"
