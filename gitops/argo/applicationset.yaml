---
# Argo CD pilot adapter only. Do not apply while Flux owns the same resources.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-generated-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/vanillacake369/tonys-homelab.git
        revision: main
        directories:
          - path: k8s/generated/apps/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: homelab-generated-apps
      source:
        repoURL: https://github.com/vanillacake369/tonys-homelab.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy: {}
