---
# 앱 HTTP Service.
# 내부 전용(ClusterIP)이라 public ingress 가 없다.
#   외부 노출(TLS/인증)은 이후 ingress 도입 시 추가한다.
apiVersion: v1
kind: Service
metadata:
  name: bookorbit
  namespace: bookorbit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
