---
# 계정 1회 자동 부트스트랩(admin + 일반 user alina).
#   BookOrbit 은 계정을 env 로 만들지 않으므로 REST API 로 부트스트랩한다:
#     1) admin   : POST /api/v1/auth/setup (x-setup-token 헤더)
#     2) alina   : admin 로그인 → POST /api/v1/users (username/name/email; 비번 불가)
#                  → 발급된 reset 토큰으로 POST /api/v1/auth/reset-password 로 비번 설정
#   모든 크리덴셜은 bookorbit-secret(SOPS)에서 주입한다.
#   멱등: 이미 존재하면(2xx 외 already/forbidden, 또는 user 목록에 존재) 성공 처리해 재실행 안전.
apiVersion: batch/v1
kind: Job
metadata:
  name: bookorbit-setup
  namespace: bookorbit
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookorbit
        app.kubernetes.io/component: setup
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: docker.io/curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SETUP_TOKEN
              valueFrom:
                secretKeyRef: { name: bookorbit-secret, key: SETUP_BOOTSTRAP_TOKEN }
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: bookorbit-secret, key: ADMIN_USERNAME }
            - name: ADMIN_NAME
              valueFrom:
                secretKeyRef: { name: bookorbit-secret, key: ADMIN_NAME }
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: bookorbit-secret, key: ADMIN_EMAIL }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: bookorbit-secret, key: ADMIN_PASSWORD }
            - name: USER_USERNAME
              valueFrom:
                secretKeyRef: { name: bookorbit-secret, key: USER_ALINA_USERNAME }
            - name: USER_NAME
              valueFrom:
                secretKeyRef: { name: bookorbit-secret, key: USER_ALINA_NAME }
            - name: USER_EMAIL
              valueFrom:
                secretKeyRef: { name: bookorbit-secret, key: USER_ALINA_EMAIL }
            - name: USER_PASSWORD
              valueFrom:
                secretKeyRef: { name: bookorbit-secret, key: USER_ALINA_PASSWORD }
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              BASE="http://bookorbit.bookorbit.svc.cluster.local:3000"
              j() { sed -n "s/.*\"$1\":\"\([^\"]*\)\".*/\1/p"; }   # naive JSON string extractor

              echo "waiting for app health..."
              i=0
              until curl -fsS -m 5 "$BASE/api/v1/health" >/dev/null 2>&1; do
                i=$((i+1)); [ "$i" -gt 60 ] && { echo "health timeout"; exit 1; }
                sleep 5
              done

              retry_post() {
                out="$1"; shift
                tries=0
                while :; do
                  tries=$((tries+1))
                  code=$(curl -sS -m 15 -o "$out" -w '%{http_code}' "$@")
                  case "$code" in
                    429)
                      [ "$tries" -ge 8 ] && { echo "$code"; return 0; }
                      sleep $((tries * 15))
                      ;;
                    *) echo "$code"; return 0 ;;
                  esac
                done
              }

              echo "[1/3] admin setup"
              ab=$(printf '{"username":"%s","name":"%s","email":"%s","password":"%s"}' \
                "$ADMIN_USERNAME" "$ADMIN_NAME" "$ADMIN_EMAIL" "$ADMIN_PASSWORD")
              c=$(retry_post /tmp/r -X POST "$BASE/api/v1/auth/setup" \
                -H "x-setup-token: $SETUP_TOKEN" -H 'Content-Type: application/json' -d "$ab")
              echo "  setup HTTP $c"
              case "$c" in
                2*|403|409) : ;;
                *) grep -qiE 'already|exists|complete|disabled' /tmp/r || { echo "admin setup failed"; exit 1; } ;;
              esac

              echo "[2/3] admin login"
              tok=$(curl -sS -m 15 -X POST "$BASE/api/v1/auth/login" -H 'Content-Type: application/json' \
                -d "$(printf '{"username":"%s","password":"%s"}' "$ADMIN_USERNAME" "$ADMIN_PASSWORD")" | j accessToken)
              if [ -z "$tok" ]; then
                case "$c" in
                  403|409)
                    echo "admin login failed after setup was already complete; skipping user bootstrap"
                    exit 0
                    ;;
                  *)
                    echo "admin login failed"
                    exit 1
                    ;;
                esac
              fi

              echo "[3/3] ensure user '$USER_USERNAME'"
              curl -sS -m 15 "$BASE/api/v1/users" -H "Authorization: Bearer $tok" -o /tmp/users
              uid=$(tr '}' '\n' < /tmp/users | grep "\"username\":\"$USER_USERNAME\"" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
              if [ -z "$uid" ]; then
                ub=$(printf '{"username":"%s","name":"%s","email":"%s"}' "$USER_USERNAME" "$USER_NAME" "$USER_EMAIL")
                curl -sS -m 15 -o /tmp/cu -X POST "$BASE/api/v1/users" \
                  -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' -d "$ub"
                rtok=$(j resetToken < /tmp/cu); [ -n "$rtok" ] || rtok=$(grep -o 'token=[a-f0-9]*' /tmp/cu | head -1 | cut -d= -f2)
                echo "  created $USER_USERNAME"
              else
                curl -sS -m 15 -o /tmp/rp -X POST "$BASE/api/v1/users/$uid/reset-password" -H "Authorization: Bearer $tok"
                rtok=$(grep -o 'token=[a-f0-9]*' /tmp/rp | head -1 | cut -d= -f2)
                echo "  $USER_USERNAME exists (id=$uid), issued reset"
              fi
              [ -n "${rtok:-}" ] || { echo "no reset token in API response"; exit 1; }

              echo "  set $USER_USERNAME password"
              c=$(curl -sS -m 15 -o /tmp/sp -w '%{http_code}' -X POST "$BASE/api/v1/auth/reset-password" \
                -H 'Content-Type: application/json' \
                -d "$(printf '{"token":"%s","newPassword":"%s"}' "$rtok" "$USER_PASSWORD")")
              echo "  reset-password HTTP $c"
              case "$c" in 2*) echo "bootstrap complete"; exit 0 ;; *) echo "set password failed"; exit 1 ;; esac
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: tmp
          emptyDir: {}
