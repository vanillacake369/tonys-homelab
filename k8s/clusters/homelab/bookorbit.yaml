---
# BookOrbit 전용 Flux Kustomization.
# 상태저장·중요 앱이라 공유 apps Kustomization 이 아니라 자체 KS 로 분리한다.
#   공유 KS 에 wait:true 로 묶으면 BookOrbit 장애가 nginx reconcile 까지 막기 때문이다(C3).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookorbit
  namespace: flux-system
spec:
  # SOPS 게이트가 끝나기 전까지 reconcile 을 멈춰 둔다.
  #   워크로드가 참조하는 bookorbit-secret 은 secret.enc.yaml 에서 오는데, 그 파일은
  #   아직 없다. suspend 없이 active 면 Secret 없이 pod 가 떠 CreateContainerConfigError 로
  #   영구 실패한다.
  # 해제 순서(design §6 / guardrails §2):
  #   1) .sops.yaml 에 k8s/ rule + cluster age key 추가·검증
  #   2) sops-age Secret 을 flux-system 에 생성·검증
  #   3) 아래 decryption 블록이 reconcile 되는지 확인
  #   4) secret.enc.yaml 커밋 + kustomization 에 등록
  #   5) 그 다음에야 suspend: false 로 바꾼다
  suspend: true
  # interval 은 필수 필드다. infrastructure.yaml 컨벤션(10m)에 맞춘다.
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/apps/bookorbit
  prune: true
  wait: true
  # local-path StorageClass(infrastructure)가 먼저 Ready 여야 PVC 가 바인딩된다.
  dependsOn:
    - name: infrastructure
  # SOPS 복호화. sops-age Secret(flux-system)이 먼저 존재해야 동작한다.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
