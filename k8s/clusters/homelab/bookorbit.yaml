---
# BookOrbit 전용 Flux Kustomization.
# 상태저장·중요 앱이라 공유 apps Kustomization 이 아니라 자체 KS 로 분리한다.
#   공유 KS 에 wait:true 로 묶으면 BookOrbit 장애가 nginx reconcile 까지 막기 때문이다(C3).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookorbit
  namespace: flux-system
spec:
  # SOPS 게이트(sops-age Secret + secret.enc.yaml) 완료 후 active.
  suspend: false
  # interval 은 필수 필드다. infrastructure.yaml 컨벤션(10m)에 맞춘다.
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/apps/bookorbit
  prune: true
  wait: true
  # local-path StorageClass(infrastructure)가 먼저 Ready 여야 PVC 가 바인딩된다.
  dependsOn:
    - name: infrastructure
  # SOPS 복호화. sops-age Secret(flux-system)이 먼저 존재해야 동작한다.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
