---
# Generated platform apps Flux Kustomization.
# Flux consumes rendered Kubernetes resources only; app intent remains in platform/apps/*.cue.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: generated-apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/generated/apps
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
