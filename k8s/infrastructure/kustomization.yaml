apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# infrastructure 레이어의 인덱스(folder-of-folders): Helm 소스 + 스토리지.
#   레이어 공통 라벨(part-of/managed-by)만 중앙 적용한다.
labels:
  - pairs:
      app.kubernetes.io/part-of: homelab-infrastructure
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
resources:
  - storage
  - networking
