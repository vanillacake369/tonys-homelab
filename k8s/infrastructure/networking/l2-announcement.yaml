---
# LB IP 를 VLAN20 의 L2 에 ARP 로 광고한다.
#   BGP 없이 같은 서브넷(homelab-1 포함)에서 LB IP 에 도달할 수 있게 한다.
#   리더 노드 하나가 해당 IP 의 ARP 에 응답한다. 노드 NIC 는 ens2.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: vlan20-l2
spec:
  loadBalancerIPs: true
  externalIPs: false
  interfaces:
    - ^ens2$
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
