apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 표준 app.kubernetes.io 라벨을 여기서 중앙 적용한다.
#   includeSelectors:false 로 Deployment 의 matchLabels selector 는 건드리지 않는다.
labels:
  - pairs:
      app.kubernetes.io/name: local-path-provisioner
      app.kubernetes.io/instance: local-path-provisioner
      app.kubernetes.io/component: storage
      app.kubernetes.io/part-of: homelab-infrastructure
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - storageclass.yaml
