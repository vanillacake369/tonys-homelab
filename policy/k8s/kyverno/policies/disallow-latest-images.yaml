apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-images
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: "has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.spec : (has(object.spec.template) ? object.spec.template.spec : object.spec)"
    - name: workloadNamespace
      expression: "has(object.metadata.namespace) ? object.metadata.namespace : 'default'"
    - name: platformController
      expression: "variables.workloadNamespace in ['flux-system', 'kyverno', 'kube-system']"
  validations:
    - expression: "variables.platformController || variables.podSpec.containers.all(container, !container.image.endsWith(':latest'))"
      message: "container images must not use the mutable :latest tag"
    - expression: "variables.platformController || !has(variables.podSpec.initContainers) || variables.podSpec.initContainers.all(container, !container.image.endsWith(':latest'))"
      message: "init container images must not use the mutable :latest tag"
