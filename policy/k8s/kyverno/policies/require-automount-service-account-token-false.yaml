apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-automount-service-account-token-false
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: "has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.spec : (has(object.spec.template) ? object.spec.template.spec : object.spec)"
    - name: workloadNamespace
      expression: "has(object.metadata.namespace) ? object.metadata.namespace : 'default'"
    - name: localPathProvisioner
      expression: "variables.workloadNamespace == 'local-path-storage' && object.metadata.name == 'local-path-provisioner'"
    - name: platformController
      expression: "variables.workloadNamespace in ['flux-system', 'kyverno', 'kube-system']"
  validations:
    - expression: "variables.platformController || variables.localPathProvisioner || (has(variables.podSpec.automountServiceAccountToken) && variables.podSpec.automountServiceAccountToken == false)"
      message: "workloads must set spec.automountServiceAccountToken=false"
